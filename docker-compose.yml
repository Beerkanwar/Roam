version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: roam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roam"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: roam-turn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--min-port=49152"
      - "--max-port=65535"
      - "--realm=roam.local"
      - "--static-auth-secret=roam-turn-static-secret-change-in-production-2026"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: roam-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=roam;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      TurnServer__SharedSecret: "roam-turn-static-secret-change-in-production-2026"
      TurnServer__Uris__0: "turn:localhost:3478"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
