version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: roam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roam}
      POSTGRES_DB: ${POSTGRES_DB:-roam}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roam} -d ${POSTGRES_DB:-roam}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roam-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: roam-turn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:-roam-turn-static-secret-change-in-production-2026}"
      - "--realm=${TURN_REALM:-turn.example.com}"
      - "--external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}"
      - "--no-tls"
      - "--no-dtls"
      - "--min-port=49160"
      - "--max-port=49200"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: roam-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-roam};Username=${POSTGRES_USER:-roam};Password=${POSTGRES_PASSWORD:-roam}"
      Cors__AllowedOrigins__0: "${PUBLIC_WEB_ORIGIN:-http://localhost:5173}"
      TurnServer__Uris__0: "turn:${TURN_HOST:-127.0.0.1}:3478"
      TurnServer__Password: "${TURN_SECRET:-roam-turn-static-secret-change-in-production-2026}"
      AllowedHosts: "${PUBLIC_API_HOST:-*}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      BOOTSTRAP_VOLUNTEER_EMAILS: "${BOOTSTRAP_VOLUNTEER_EMAILS:-}"
    volumes:
      - dataprotection:/app/keys
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  dataprotection:
