worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Upgrade to WebSocket when the client asks for it (SignalR), keep-alive otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Docker's embedded DNS returns one address per API replica. "resolve" (nginx >= 1.27.3) keeps
    # re-resolving the name, so every replica receives traffic (round-robin) and scaling API_REPLICAS
    # up or down takes effect without restarting the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream roam_api {
        zone roam_api 64k;
        server api:8080 resolve;
        keepalive 32;
    }

    server {
        listen 8080;
        client_max_body_size 1m;

        location / {
            proxy_pass http://roam_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
