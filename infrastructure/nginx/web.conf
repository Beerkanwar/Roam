worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Real client IP -------------------------------------------------------------------------
    # Traffic arrives from Cloudflare through the cloudflared container (a private Docker address), which
    # passes the visitor's address in CF-Connecting-IP. Only trust it from private networks, so a request
    # reaching nginx directly cannot spoof it. The API rate-limits sign-in attempts per IP, so without this
    # every visitor would share one limit.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;

    # Cloudflare terminates HTTPS; keep its scheme so the API builds https:// links (e.g. in emails).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Upgrade to WebSocket when the client asks for it (SignalR), keep-alive otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Docker's DNS returns one address per API replica; "resolve" (nginx >= 1.27.3) keeps re-resolving,
    # so every replica gets traffic and scaling API_REPLICAS needs no proxy restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream roam_api {
        zone roam_api 64k;
        server api:8080 resolve;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 1m;

        # Security headers for the app (the API's JSON responses get them too; harmless there).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss://$http_host ws://$http_host https://tiles.openfreemap.org https://api.maptiler.com; worker-src 'self' blob:; child-src blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # API: REST, SignalR hubs, health and the ASP.NET Core Identity endpoints.
        location ~ ^/(api|hubs|manage)/ {
            proxy_pass http://roam_api;
            include /etc/nginx/roam_proxy_params;
        }
        location ~ ^/(health|register|login|refresh|confirmEmail|resendConfirmationEmail|forgotPassword|resetPassword)$ {
            proxy_pass http://roam_api;
            include /etc/nginx/roam_proxy_params;
        }

        root /usr/share/nginx/html;

        # Hashed build output never changes: cache for a year.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # The app shell must always be revalidated so new releases are picked up.
        location / {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss://$http_host ws://$http_host https://tiles.openfreemap.org https://api.maptiler.com; worker-src 'self' blob:; child-src blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
