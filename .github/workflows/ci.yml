name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: |
        dotnet restore src/Roam.Api/Roam.Api.csproj
        dotnet restore tests/Roam.Domain.Tests/Roam.Domain.Tests.csproj
        dotnet restore tests/Roam.Application.Tests/Roam.Application.Tests.csproj
        dotnet restore tests/Roam.Infrastructure.Tests/Roam.Infrastructure.Tests.csproj
        dotnet restore tests/Roam.Api.Tests/Roam.Api.Tests.csproj
        dotnet restore tests/Roam.IntegrationTests/Roam.IntegrationTests.csproj

    - name: Scan vulnerable packages
      # `dotnet list package --vulnerable` always exits 0, so fail explicitly when anything is reported.
      run: |
        set -o pipefail
        status=0
        for project in src/Roam.Api/Roam.Api.csproj tests/Roam.Api.Tests/Roam.Api.Tests.csproj tests/Roam.IntegrationTests/Roam.IntegrationTests.csproj; do
          dotnet list "$project" package --vulnerable --include-transitive | tee scan.txt
          if grep -q "has the following vulnerable packages" scan.txt; then status=1; fi
        done
        exit $status

    - name: Build backend
      run: |
        dotnet build src/Roam.Api/Roam.Api.csproj -c Release --no-restore
        dotnet build tests/Roam.Domain.Tests/Roam.Domain.Tests.csproj -c Release --no-restore
        dotnet build tests/Roam.Application.Tests/Roam.Application.Tests.csproj -c Release --no-restore
        dotnet build tests/Roam.Infrastructure.Tests/Roam.Infrastructure.Tests.csproj -c Release --no-restore
        dotnet build tests/Roam.Api.Tests/Roam.Api.Tests.csproj -c Release --no-restore
        dotnet build tests/Roam.IntegrationTests/Roam.IntegrationTests.csproj -c Release --no-restore

    - name: Run unit and integration tests
      run: |
        dotnet test tests/Roam.Domain.Tests/Roam.Domain.Tests.csproj -c Release --no-build --verbosity normal
        dotnet test tests/Roam.Application.Tests/Roam.Application.Tests.csproj -c Release --no-build --verbosity normal
        dotnet test tests/Roam.Infrastructure.Tests/Roam.Infrastructure.Tests.csproj -c Release --no-build --verbosity normal
        dotnet test tests/Roam.Api.Tests/Roam.Api.Tests.csproj -c Release --no-build --verbosity normal
        dotnet test tests/Roam.IntegrationTests/Roam.IntegrationTests.csproj -c Release --no-build --verbosity normal

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Roam.Web

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: src/Roam.Web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Audit dependencies
      run: npm audit --audit-level=high

    - name: Run linter
      run: npm run lint

    - name: Run frontend tests
      run: npm test

    - name: Build web application
      run: npm run build

  docker:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
    - uses: actions/checkout@v4

    - name: Build API Docker Image
      run: docker build -f infrastructure/docker/Dockerfile -t roam-api:ci .

    - name: Build Web Docker Image
      run: docker build -f infrastructure/docker/web.Dockerfile -t roam-web:ci .

    - name: Build PostGIS Docker Image
      run: docker build -f infrastructure/docker/postgis.Dockerfile -t roam-postgis:ci .

    - name: Validate production compose file
      working-directory: deploy
      env:
        POSTGRES_PASSWORD: ci
        PUBLIC_DOMAIN: ci.example.com
        DATA_PROTECTION_CERT_BASE64: ci
      run: docker compose config --quiet

    - name: Check deployment scripts
      run: for f in deploy/*.sh infrastructure/nginx/40-legal-placeholders.sh; do bash -n "$f"; done
